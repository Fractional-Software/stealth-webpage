<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fraction Software</title>
<meta name="description" content="Agentic workflows at a fraction of the cost. Coming soon.">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Fraction Software">
<meta property="og:description" content="Agentic workflows at a fraction of the cost.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://fraction.software/">
<link rel="canonical" href="https://fraction.software/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%231a1b26'/><text x='50' y='72' font-size='64' font-family='monospace' text-anchor='middle' fill='%237aa2f7'>%2F</text></svg>">
<style>
  :root {
    --bg:        #1a1b26;
    --bg-deep:   #16161e;
    --fg:        #c0caf5;
    --muted:     #565f89;
    --blue:      #7aa2f7;
    --cyan:      #7dcfff;
    --green:     #9ece6a;
    --magenta:   #bb9af7;
    --line:      #292e42;
    --mono: "Berkeley Mono", "JetBrains Mono", "SF Mono", ui-monospace,
            SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(60rem 40rem at 15% -10%, #24283b 0%, transparent 60%),
      radial-gradient(50rem 35rem at 95% 110%, #1f2335 0%, transparent 65%);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100svh;
  }

  /* faint grid, keeps the flat dark from feeling empty */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(to right, var(--line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    opacity: .35;
    mask-image: radial-gradient(70% 60% at 50% 45%, #000 0%, transparent 100%);
    -webkit-mask-image: radial-gradient(70% 60% at 50% 45%, #000 0%, transparent 100%);
  }

  main {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: min(72rem, 100% - 3rem);
    margin-inline: auto;
    padding: 6rem 0;
  }

  .eyebrow {
    color: var(--muted);
    font-size: .8125rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin: 0 0 1.75rem;
  }
  .eyebrow .dot {
    display: inline-block;
    width: .5em; height: .5em;
    border-radius: 50%;
    background: var(--green);
    margin-right: .6em;
    vertical-align: .05em;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  h1 {
    margin: 0;
    font-size: clamp(2.25rem, 8vw, 5.5rem);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.045em;
    color: #e6ecff;
  }
  h1 .slash { color: var(--blue); }
  h1 .caret {
    display: inline-block;
    width: .5em;
    height: .78em;
    background: var(--cyan);
    margin-left: .18em;
    vertical-align: -0.06em;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

  .sub {
    margin: 1.75rem 0 0;
    max-width: 46ch;
    font-size: clamp(1rem, 2.2vw, 1.3125rem);
    line-height: 1.55;
    color: #a9b1d6;
  }
  .sub em { font-style: normal; color: var(--magenta); }
  .sub strong { font-weight: 700; color: var(--cyan); }

  .rule {
    margin: 3rem 0 2rem;
    height: 1px;
    width: min(28rem, 100%);
    background: linear-gradient(to right, var(--blue), transparent);
    opacity: .55;
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: .75rem 2.5rem;
    margin: 0;
    padding: 0;
    list-style: none;
    color: var(--muted);
    font-size: .875rem;
  }
  .meta b { color: var(--fg); font-weight: 400; }

  footer {
    position: relative;
    width: min(72rem, 100% - 3rem);
    margin-inline: auto;
    padding: 1.5rem 0 2rem;
    color: var(--muted);
    font-size: .8125rem;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    border-top: 1px solid var(--line);
  }
  footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; }
  footer a:hover { color: var(--fg); border-bottom-color: var(--line); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow"><span class="dot"></span>In stealth &mdash; launching soon</p>

    <h1>Fraction<br><span class="slash">/</span>Software<span class="caret"></span></h1>

    <p class="sub">
      Agentic workflows that run at a <strong>fraction of the cost</strong>.
      Same output, <em>a fraction of the spend</em>.
    </p>

    <div class="rule"></div>

    <ul class="meta">
      <li>status: <b>building</b></li>
      <li>launch: <b>soon</b></li>
    </ul>

  </main>

  <footer>
    <span>&copy; <span id="y">2026</span> Fraction Software</span>
    <span>All rights reserved</span>
  </footer>

  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
